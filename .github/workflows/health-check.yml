name: Production health check

# Independent of the host: if Railway stops serving, or the database becomes
# unreachable, this fails and GitHub emails the repo owner. It is a backstop
# for a dedicated uptime service, not a replacement — GitHub delays scheduled
# runs under load, so treat the timing as best-effort.
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "30 1 * * *" # 07:00 IST — the capacity check, once a day
  workflow_dispatch: # lets you trigger a check by hand from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          BASE="https://dhanam-store-production.up.railway.app"

          # Retry a few times so a single blip or a deploy swap does not page.
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 25 -w "\n%{http_code}" "$BASE/health" || echo -e "\n000")
            code=$(printf '%s' "$body" | tail -n1)
            payload=$(printf '%s' "$body" | sed '$d')
            echo "attempt $attempt: HTTP $code $payload"

            if [ "$code" = "200" ] && printf '%s' "$payload" | grep -q '"healthy"'; then
              echo "Healthy."
              exit 0
            fi
            [ $attempt -lt 3 ] && sleep 20
          done

          echo "::error::Health check failed after 3 attempts (last: HTTP $code $payload)"
          exit 1

      - name: Verify the catalog actually serves
        run: |
          BASE="https://dhanam-store-production.up.railway.app"

          # /health only proves the process is up and Mongo answers a ping.
          # This catches the case where the app runs but returns no products.
          total=$(curl -sS --max-time 25 "$BASE/products?limit=1" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('total',0))")
          echo "products reported: $total"

          if [ "${total:-0}" -lt 1 ]; then
            echo "::error::API is up but returned $total products"
            exit 1
          fi

  capacity:
    # Once a day, not every fifteen minutes: storage moves slowly, and a
    # measurement that repeats 96 times a day is one nobody reads.
    if: github.event.schedule == '30 1 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "pymongo==4.17.0"

      - name: Measure the database against the M0 limit
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::notice::MONGODB_URI secret is not set — skipping the capacity check."
            echo "Add it under Settings → Secrets and variables → Actions to enable this."
            exit 0
          fi
          python3 - <<'PY'
          import os, sys
          from pymongo import MongoClient

          # M0's storage ceiling. Change this if the cluster tier changes, or
          # the percentages below will quietly describe the wrong limit.
          LIMIT_MB = 512
          WARN_AT, FAIL_AT = 50, 75

          client = MongoClient(os.environ["MONGODB_URI"], serverSelectionTimeoutMS=20000)
          stats = client.get_database(os.environ.get("DATABASE_NAME", "dhanam_store")).command("dbStats")
          used_mb = (stats["dataSize"] + stats["indexSize"]) / 1024 / 1024
          pct = used_mb / LIMIT_MB * 100

          print(f"data + indexes: {used_mb:.1f} MB of {LIMIT_MB} MB  ({pct:.1f}%)")

          # Orders are the only collection that grows without bound, so the
          # useful number is not today's size but how long the headroom lasts.
          orders = client.get_database(os.environ.get("DATABASE_NAME", "dhanam_store")).orders
          count = orders.estimated_document_count()
          if count:
              per_order_kb = (orders.aggregate([{"$collStats": {"storageStats": {}}}]).next()
                              ["storageStats"]["size"] / count / 1024)
              headroom = (LIMIT_MB - used_mb) * 1024 / max(per_order_kb, 0.1)
              print(f"orders: {count} at ~{per_order_kb:.1f} KB each — "
                    f"room for roughly {headroom:,.0f} more")

          if pct >= FAIL_AT:
              print(f"::error::Database is {pct:.0f}% of the {LIMIT_MB} MB limit. "
                    "Writes start failing at 100% — orders would stop being accepted "
                    "while the catalogue kept serving. Upgrade the cluster tier.")
              sys.exit(1)
          if pct >= WARN_AT:
              print(f"::warning::Database is {pct:.0f}% of the {LIMIT_MB} MB limit. "
                    "Worth planning the upgrade rather than reacting to it.")
          PY
