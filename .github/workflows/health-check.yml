name: Production health check

# Independent of the host: if Railway stops serving, or the database becomes
# unreachable, this fails and GitHub emails the repo owner. It is a backstop
# for a dedicated uptime service, not a replacement — GitHub delays scheduled
# runs under load, so treat the timing as best-effort.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: # lets you trigger a check by hand from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          BASE="https://dhanam-store-production.up.railway.app"

          # Retry a few times so a single blip or a deploy swap does not page.
          for attempt in 1 2 3; do
            body=$(curl -sS --max-time 25 -w "\n%{http_code}" "$BASE/health" || echo -e "\n000")
            code=$(printf '%s' "$body" | tail -n1)
            payload=$(printf '%s' "$body" | sed '$d')
            echo "attempt $attempt: HTTP $code $payload"

            if [ "$code" = "200" ] && printf '%s' "$payload" | grep -q '"healthy"'; then
              echo "Healthy."
              exit 0
            fi
            [ $attempt -lt 3 ] && sleep 20
          done

          echo "::error::Health check failed after 3 attempts (last: HTTP $code $payload)"
          exit 1

      - name: Verify the catalog actually serves
        run: |
          BASE="https://dhanam-store-production.up.railway.app"

          # /health only proves the process is up and Mongo answers a ping.
          # This catches the case where the app runs but returns no products.
          total=$(curl -sS --max-time 25 "$BASE/products?limit=1" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('total',0))")
          echo "products reported: $total"

          if [ "${total:-0}" -lt 1 ]; then
            echo "::error::API is up but returned $total products"
            exit 1
          fi
